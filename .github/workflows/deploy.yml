name: Build & Deploy to Cloudflare Pages and Workers

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Build (static SSR)
        run: dart run jaspr_cli:jaspr build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaspr-build
          path: build/jaspr

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        if: github.ref == 'refs/heads/master'

      - name: Deploy Worker to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
        if: github.ref == 'refs/heads/development'

  deploy-production:
    name: Deploy to Cloudflare Pages (production)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jaspr-build
          path: build/jaspr

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/jaspr --project-name=omaradel --branch=master

  deploy-preview:
    name: Deploy to Cloudflare Pages (preview)
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jaspr-build
          path: build/jaspr

      - name: Publish preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/jaspr --project-name=omaradel --branch=${{ github.head_ref }}

  deploy-development-pages:
    name: Deploy to Cloudflare Pages (development preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jaspr-build
          path: build/jaspr

      - name: Publish development preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/jaspr --project-name=omaradel --branch=development
